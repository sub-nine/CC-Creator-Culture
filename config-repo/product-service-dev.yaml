server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${PRODUCT_DATASOURCE_URL}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  # 앱 기동 시 Flyway가 db/migration을 적용한다.
  flyway:
    enabled: true
