spring:
  config:
    activate:
      on-profile: test
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
      import-check:
        enabled: false
    eureka:
      client:
        enabled: false
        register-with-eureka: false
        fetch-registry: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cloudflare:
  r2:
    access-key: "test-access-key"
    secret-key: "test-secret-key"
    endpoint: "https://test.r2.cloudflarestorage.com"
    bucket: "test-bucket"