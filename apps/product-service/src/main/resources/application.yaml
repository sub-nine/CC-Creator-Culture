spring:
  application:
    name: product-service

  config:
    import: ${CONFIG_SERVER_IMPORT:optional:configserver:http://localhost:8888}

  # 기본은 비활성. OCI dev는 ddl-auto: update 경로를 유지하고 prod 설정에서만 켠다.
  flyway:
    enabled: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

kafka:
  bootstrap-servers: localhost:9092
  auto-offset-reset: latest
  product-group-id: product-group
  category-group-id: category-group
  leaderboard-group-id: leaderboard-group