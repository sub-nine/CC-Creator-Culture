spring:
  application:
    name: product-service

  config:
    import: ${CONFIG_SERVER_IMPORT:optional:configserver:http://localhost:8888}

  # 기본은 비활성. dev와 prod 설정에서 켠다.
  flyway:
    enabled: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

embedding:
  client:
    base-url: ${EMBEDDING_SERVICE_URL:http://localhost:8000}

