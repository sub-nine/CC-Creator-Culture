spring:
  application:
    name: product-service

  config:
    import: ${CONFIG_SERVER_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

kafka:
  bootstrap-servers: localhost:9092
  auto-offset-reset: latest
  product-group-id: product-group
  category-group-id: category-group