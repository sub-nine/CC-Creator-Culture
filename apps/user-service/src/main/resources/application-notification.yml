spring:
  application:
    name: notification-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/notification}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
          format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service-notification
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Consumer가 JSON 문자열을 직접 ObjectMapper로 변환하므로 StringDeserializer를 사용합니다.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 한 레코드의 Listener 호출이 정상 종료된 뒤 offset을 commit합니다.
      ack-mode: record

app:
  kafka:
    topics:
      product-events: product.notification-events.v1
      order-events: order.notification-events.v1
  slack:
    enabled: true
    worker-delay-ms: 5000
    max-retries: 3
    retry-delay-ms: 30000
    webhooks:
      PAYMENT_ALERT: ${SLACK_PAYMENT_WEBHOOK_URL:}
      ORDER_ALERT: ${SLACK_ORDER_WEBHOOK_URL:}
      PRODUCT_ALERT: ${SLACK_PRODUCT_WEBHOOK_URL:}

