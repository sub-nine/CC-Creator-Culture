spring:
  application:
    name: order-service

  config:
    import: ${CONFIG_SERVER_IMPORT:optional:configserver:http://localhost:8888}

  # 기본은 비활성. OCI dev는 ddl-auto: update 경로를 유지하고 prod 설정에서만 켠다.
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000