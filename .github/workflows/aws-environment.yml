name: AWS Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Environment action
        required: true
        type: choice
        options: [create, start, deploy, stop, teardown, bootstrap-roles]
      release_id:
        description: Validated release id. Required for deploy and bootstrap-roles.
        required: false
        type: string
      terraform_plan_uri:
        description: Saved Terraform plan file or s3:// URI for create/teardown
        required: false
        type: string
      terraform_dir:
        description: Directory that produced the saved plan
        required: false
        type: string
      seed_run_id:
        description: Optional explicit seed run id. Start never seeds.
        required: false
        type: string
      confirm_data_preserved:
        description: Teardown confirmation that data is preserved
        required: false
        type: boolean
        default: false
      confirm_no_unprocessed_events:
        description: Teardown confirmation that Kafka lag is clear
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cc-aws-environment
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }} AWS environment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      ENVCTL_ALLOW_LIVE: "true"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOYMENT_CONFIG_URI: ${{ vars.AWS_DEPLOYMENT_CONFIG_URI }}
    steps:
      - uses: actions/checkout@v6

      - name: Require Terraform apply role
        if: inputs.action == 'create' || inputs.action == 'teardown'
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_TERRAFORM_ROLE_ARN"

      - name: Require DB bootstrap role
        if: inputs.action == 'bootstrap-roles'
        env:
          AWS_DB_BOOTSTRAP_ROLE_ARN: ${{ vars.AWS_DB_BOOTSTRAP_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_DB_BOOTSTRAP_ROLE_ARN"

      - name: Require runtime role
        if: inputs.action != 'create' && inputs.action != 'teardown' && inputs.action != 'bootstrap-roles'
        env:
          AWS_RUNTIME_ROLE_ARN: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_RUNTIME_ROLE_ARN"

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.action == 'create' || inputs.action == 'teardown'
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: cc-aws-terraform
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.action == 'bootstrap-roles'
        with:
          role-to-assume: ${{ vars.AWS_DB_BOOTSTRAP_ROLE_ARN }}
          role-session-name: cc-aws-db-bootstrap
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.action != 'create' && inputs.action != 'teardown' && inputs.action != 'bootstrap-roles'
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
          role-session-name: cc-aws-envctl
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        if: inputs.action == 'create' || inputs.action == 'teardown'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Load deployment config
        if: inputs.action != 'create'
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOYMENT_CONFIG_URI"
          aws s3 cp "$AWS_DEPLOYMENT_CONFIG_URI" "$RUNNER_TEMP/deployment_config.json"

      - name: Fetch release
        if: inputs.action == 'deploy' || inputs.action == 'bootstrap-roles'
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          bucket="$(jq -er '.release_bucket' "$RUNNER_TEMP/deployment_config.json")"
          aws s3 cp "s3://${bucket}/releases/${RELEASE_ID}.json" "$RUNNER_TEMP/release.json"

      - name: Fetch saved plan
        if: inputs.action == 'create' || inputs.action == 'teardown'
        env:
          PLAN_URI: ${{ inputs.terraform_plan_uri }}
        run: |
          set -euo pipefail
          test -n "$PLAN_URI"
          if [[ "$PLAN_URI" == s3://* ]]; then
            aws s3 cp "$PLAN_URI" "$RUNNER_TEMP/saved.tfplan"
          else
            cp "$PLAN_URI" "$RUNNER_TEMP/saved.tfplan"
          fi

      - name: Run environment action
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_ID: ${{ inputs.release_id }}
          TERRAFORM_DIR: ${{ inputs.terraform_dir }}
          SEED_RUN_ID: ${{ inputs.seed_run_id }}
          CONFIRM_DATA: ${{ inputs.confirm_data_preserved }}
          CONFIRM_EVENTS: ${{ inputs.confirm_no_unprocessed_events }}
        run: |
          set -euo pipefail
          args=(--action "$ACTION")
          if [[ "$ACTION" != create ]]; then
            args+=(--config "$RUNNER_TEMP/deployment_config.json")
          fi
          if [[ "$ACTION" == deploy || "$ACTION" == bootstrap-roles ]]; then
            args+=(--release "$RUNNER_TEMP/release.json")
          fi
          if [[ "$ACTION" == create || "$ACTION" == teardown ]]; then
            args+=(--plan "$RUNNER_TEMP/saved.tfplan")
            test -n "$TERRAFORM_DIR"
            args+=(--terraform-dir "$TERRAFORM_DIR")
          fi
          if [[ -n "$SEED_RUN_ID" ]]; then
            args+=(--seed-run-id "$SEED_RUN_ID")
          fi
          args+=(--confirm-data-preserved "$CONFIRM_DATA" --confirm-no-unprocessed-events "$CONFIRM_EVENTS")
          bash deploy/aws/envctl.sh "${args[@]}"
