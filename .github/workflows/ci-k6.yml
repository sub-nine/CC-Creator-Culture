name: CI - k6

on:
  push:
    branches: [main, dev]
    paths:
      - "load-test/**"
      - ".github/workflows/ci-k6.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "load-test/**"
      - ".github/workflows/ci-k6.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-k6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k6-image:
    name: Build ARM64 k6 image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build image
        run: docker build --platform linux/arm64 -f load-test/Dockerfile.cloud -t cc-k6:verify load-test
