name: CI - Gateway

on:
  push:
    branches: [main, dev]
    paths:
      - "infra/gateway/**"
      - "config-repo/gateway*.yaml"
      - "config-repo/application*.yaml"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".github/workflows/ci-module.yml"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "infra/gateway/**"
      - "config-repo/gateway*.yaml"
      - "config-repo/application*.yaml"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".github/workflows/ci-module.yml"
      - ".github/workflows/ci-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci-module.yml
    with:
      module-name: gateway
      gradle-task: ":infra:gateway:build"
      test-report-path: infra/gateway/build/reports/tests/
      use-postgres: false
