name: AWS envctl checks

on:
  pull_request:
    paths:
      - "deploy/aws/**"
      - ".github/workflows/aws-*.yml"
      - ".github/scripts/validate-aws-release-record.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)"

      - name: Shellcheck and actionlint
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          (cd deploy/aws && shellcheck -x envctl.sh ecs-deploy.sh db-tasks.sh obs-tasks.sh envctl_test.sh)
          ./actionlint .github/workflows/aws-environment.yml .github/workflows/aws-envctl-check.yml

      - name: Mocked envctl checks
        run: bash deploy/aws/envctl_test.sh
